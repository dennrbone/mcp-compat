[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-compat"
version = "0.1.0"
description = "Research infrastructure for MCP tool contract compatibility"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jsonschema>=4.18,<5",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
    "pytest-cov>=4,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
