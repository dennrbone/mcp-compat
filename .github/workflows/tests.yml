name: tests

on:
  push:
    branches:
      - main
      - "phase/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      real_provider_smoke:
        description: "Run selected CLI smoke on an authenticated self-hosted runner"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    # Python 3.11.4 is published for this image; latest may move to Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.11.4"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: >-
          pytest -q
          --cov=mcp_compat
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=100
      - run: ruff check src tests examples
      - run: mypy src
      - run: python -m build

  offline-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.11.4"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: mcp-compat-demo --output /tmp/mcp-compat-offline-demo
      - run: mcp-compat-analyze --run /tmp/mcp-compat-offline-demo --output /tmp/mcp-compat-offline-analysis

  provider-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.real_provider_smoke
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.11.4"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q -rs -m real_provider tests/test_provider_smoke.py
        env:
          MCP_COMPAT_RUN_PROVIDER_SMOKE: "1"
          GIGACODE_BIN: ${{ vars.GIGACODE_BIN }}
