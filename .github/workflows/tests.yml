name: tests

on:
  push:
    branches:
      - main
      - "phase/**"
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.4"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          pytest -q
          --cov=mcp_compat
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=100
