[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-compat"
version = "0.1.0"
description = "Research infrastructure for MCP tool contract compatibility"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jsonschema>=4.18,<5",
    "referencing>=0.30,<1",
    "pydantic>=2,<3",
]

[project.scripts]
mcp-compat-demo = "mcp_compat.experiments:demo_cli"
mcp-compat-analyze = "mcp_compat.analysis:analysis_cli"
mcp-compat-agents = "mcp_compat.agent_checks:agent_cli"

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
    "pytest-cov>=4,<7",
    "hypothesis>=6,<7",
    "ruff>=0.12,<1",
    "mypy>=1.16,<2",
    "types-jsonschema>=4,<5",
    "build>=1,<2",
]
mcp = ["mcp==1.30.0"]
mcp2026 = ["mcp==2.3.0"]
llm = ["httpx==0.28.1"]
analysis = ["scipy>=1.11,<2", "matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_provider: opt-in real inference; requires explicit authorization and resources"]
